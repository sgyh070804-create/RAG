<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一版 RAG · 本地问答</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23167568'/%3E%3Ctext x='11' y='29' font-size='26' fill='white'%3EY%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#263c36;background:#f5f7f6;font-size:14px}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:0 auto;padding:32px 24px 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px}.brand{display:flex;gap:10px;align-items:center;font-weight:600}.mark{background:#167568;color:white;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px}.panel{background:#fff;border:1px solid #e0e7e2;border-radius:13px;padding:22px;box-shadow:0 5px 20px #17382503}label{display:block;font-size:12px;color:#698173;margin-bottom:12px}textarea{width:100%;resize:vertical;min-height:95px;max-height:240px;border:0;outline:none;padding:0;color:#2c4239;line-height:1.8;background:none;font:inherit;font-size:15px}textarea::placeholder{color:#a5afa9}.actions{border-top:1px solid #edf1ee;padding-top:14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.status{font-size:11px;color:#8b998f;line-height:1.6}.status.bad{color:#ac7657}button{font:inherit;cursor:pointer}#send{margin-left:auto;background:#167568;border:0;color:white;border-radius:8px;padding:10px 20px;white-space:nowrap}#send:disabled{opacity:.45;cursor:wait}.examples{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 28px}.examples span{font-size:11px;color:#98a29b;margin-right:3px}.examples button{font-size:11px;background:#fff;border:1px solid #e1e7e2;border-radius:20px;padding:7px 11px;color:#708376}.examples button:hover{border-color:#9bbfa9;color:#167568}.result{min-height:140px}h2{font-size:13px;margin:0 0 16px;font-weight:500;color:#668571}.answer{font-size:15px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}.muted{font-size:13px;color:#a1ada5}.refused{color:#9c7b3b}.timing{color:#9aa89e;font-size:10px;margin-top:18px;line-height:1.8}.error{color:#b06550;font-size:13px;line-height:1.9}.evidence{margin-top:18px;border:1px solid #e1e8e2;border-radius:10px;background:#fff;overflow:hidden}.evidence>summary{font-size:12px;color:#718b79;padding:16px;cursor:pointer}.source{padding:0 16px 15px}.source details{border-top:1px solid #edf1ee}.source summary{cursor:pointer;padding:13px 0;font-size:12px;color:#617b69;overflow-wrap:anywhere}.source small{color:#9ca89f;font-size:10px;margin-left:10px}.source pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:12px;line-height:1.9;background:#f7faf7;padding:15px;border-radius:8px;color:#6e8174}.spinner{display:inline-block;width:12px;height:12px;border:1.5px solid #d4e3d7;border-top-color:#4f9070;border-radius:50%;animation:spin 1s linear infinite;margin-right:7px;vertical-align:-1px}@keyframes spin{to{transform:rotate(360deg)}}[hidden]{display:none!important}:focus-visible{outline:2px solid #8ab79a;outline-offset:4px}@media(max-width:550px){main{padding:24px 18px}header{margin-bottom:24px}.panel{padding:18px}.actions{align-items:flex-end}.status{max-width:180px;font-size:10px}#send{padding:10px 17px}.examples{gap:6px}.examples button{font-size:10px}.source small{display:block;margin:5px 0 0}}
</style></head><body><main>
<header><div class="brand"><span class="mark">Y</span>rag · 文档问答</div></header>

<form id="form" class="panel"><label for="question">你的问题</label><textarea id="question" maxlength="2000" placeholder="例如：一线城市出差住宿上限是多少？" disabled></textarea><div class="actions"><span id="status" class="status" role="status">正在加载本地知识库…</span><button id="send" disabled>提问</button></div></form>
<div class="examples"><span>试着问</span><button type="button" data-question="一线城市出差住宿上限是多少？">住宿上限</button><button type="button" data-question="API Token 有效期多久？">Token 有效期</button><button type="button" data-question="公司的股票代码是多少？">资料外问题</button></div>
<section class="panel result" aria-live="polite"><h2>回答</h2><div id="answer" class="answer muted">提问后，回答会显示在这里。</div><div id="timing" class="timing"></div><div id="error" class="error"></div></section>
<details id="evidence" class="evidence" hidden><summary id="evidence-title">查看检索资料</summary><div id="sources" class="source"></div></details>

</main><script>
const $=id=>document.getElementById(id);let ready=false,busy=false;
function controls(){$('send').disabled=!ready||busy;$('question').disabled=!ready||busy;$('send').textContent=busy?'处理中…':'提问';}
async function health(){try{const r=await fetch('/api/health',{signal:AbortSignal.timeout(6000)});if(!r.ok)throw new Error();const d=await r.json();ready=d.ready;$('status').textContent=d.error?'加载失败：'+d.error:ready?'':'正在加载知识库，已等 '+d.waited+' 秒…';$('status').classList.toggle('bad',Boolean(d.error));$('status').hidden=ready&&!d.error;}catch(e){ready=false;$('status').hidden=false;$('status').textContent='无法连接本地服务，请确认启动窗口仍在运行';$('status').classList.add('bad');}controls();setTimeout(health,ready?15000:1500);}
async function ask(question){question=(question||'').trim();if(!ready||busy||!question)return;busy=true;controls();$('answer').className='answer muted';$('answer').innerHTML='<span class="spinner"></span>正在检索资料并生成回答…';$('timing').textContent='';$('error').textContent='';$('evidence').hidden=true;$('sources').replaceChildren();try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question}),signal:AbortSignal.timeout(190000)});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'问题未能处理，请检查输入后重试');$('answer').className='answer'+(d.refused?' refused':'');$('answer').textContent=d.answer;$('timing').textContent='检索 '+d.timing.retrieve+'s · 生成 '+d.timing.generate+'s · 合计 '+d.timing.total+'s'+(d.refused?' · 检索层拒答，未调用模型':'');if(d.generation_error)$('error').textContent='本地生成服务未就绪，可先查看原文资料。';$('evidence').hidden=!d.hits.length;$('evidence-title').textContent='查看检索资料（'+d.hits.length+' 段）';for(const h of d.hits){const item=document.createElement('details'),s=document.createElement('summary'),meta=document.createElement('small'),text=document.createElement('pre');s.textContent=h.source;meta.textContent='距离 '+Number(h.distance).toFixed(3);s.append(meta);text.textContent=h.text;item.append(s,text);$('sources').append(item);}}catch(e){$('answer').textContent='本次未能取得回答。';$('answer').className='answer muted';$('error').textContent=e.name==='TimeoutError'?'等待超时，请确认服务状态后重试。':e.message;}finally{busy=false;controls();}}
$('form').addEventListener('submit',e=>{e.preventDefault();ask($('question').value)});$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask($('question').value)}});document.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>{if(busy)return;$('question').value=b.dataset.question;ask(b.dataset.question)}));health();
</script></body></html>
